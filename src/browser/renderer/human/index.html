<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="human.css">
  <title>agent-browser</title>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" title="새 탭">+</button>
    <div id="viewing" hidden><span class="label"></span><button type="button" class="back-to-own">내 탭으로</button></div>
  </div>
  <form id="nav">
    <button type="button" id="back" title="뒤로">←</button>
    <button type="button" id="forward" title="앞으로">→</button>
    <button type="button" id="reload" title="새로고침">↻</button>
    <input id="address" name="address" autocomplete="off" spellcheck="false" placeholder="주소 입력">
    <span id="loading" hidden>불러오는 중…</span>
    <button type="button" id="zoom-button" hidden title="배율 기본값으로 (⌘0)" aria-label="배율">🔍</button>
    <button type="button" id="bookmark-star" title="이 페이지 북마크 (⌘D)" aria-pressed="false">☆</button>
    <button type="button" id="theme-button" title="테마" aria-label="테마" aria-haspopup="menu" data-mode="system"><span class="icon" aria-hidden="true">◐</span></button>
  </form>
  <div id="bookmarks" aria-label="북마크">
    <input id="bookmark-name" hidden autocomplete="off" spellcheck="false">
    <span id="bookmark-items"></span>
    <span id="bookmarks-empty">☆ 또는 ⌘D로 지금 페이지를 북마크합니다</span>
    <form id="find" hidden role="search">
      <input id="find-text" autocomplete="off" spellcheck="false" placeholder="페이지에서 찾기" aria-label="페이지에서 찾기">
      <span id="find-count" hidden></span>
      <button type="button" id="find-prev" title="이전 (⇧⌘G)">▲</button>
      <button type="button" id="find-next" title="다음 (⌘G)">▼</button>
      <button type="button" id="find-close" title="닫기 (Esc)">✕</button>
    </form>
  </div>
  <div id="zoom-notice" hidden role="status"><span class="pct"></span> · <button type="button" class="reset">재설정</button></div>
  <p id="view-empty" hidden>이 세션에 열린 탭이 없습니다</p>
  <aside id="panel" aria-label="에이전트 세션">
    <section id="update" hidden aria-live="polite">
      <div class="what"><span id="update-text"></span></div>
      <div class="note" id="update-note">누르면 앱이 다시 켜진다. 에이전트 세션은 끊기니 Claude Code에서 /mcp로 다시 연결한다</div>
      <button id="update-install">업데이트</button>
    </section>
    <div id="toast" hidden role="status"></div>
    <section id="approvals-section" hidden>
      <h2>승인 요청</h2>
      <ul id="approvals"></ul>
    </section>
    <div class="sessions-head">
      <h2>에이전트 세션</h2>
      <label class="follow" title="켜 두면 에이전트가 움직일 때 그 세션 화면을 왼쪽에 보여 준다"><input type="checkbox" id="follow"> 따라 보기</label>
    </div>
    <p id="sessions-empty">에이전트 세션 없음</p>
    <ul id="sessions"></ul>
  </aside>
  <script src="human.js"></script>
</body>
</html>
