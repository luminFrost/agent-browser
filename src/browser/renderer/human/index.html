<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <link rel="stylesheet" href="human.css">
  <title>agent-browser</title>
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" title="새 탭">+</button>
  </div>
  <form id="nav">
    <button type="button" id="back" title="뒤로">←</button>
    <button type="button" id="forward" title="앞으로">→</button>
    <button type="button" id="reload" title="새로고침">↻</button>
    <input id="address" name="address" autocomplete="off" spellcheck="false" placeholder="주소 입력">
    <span id="loading" hidden>불러오는 중…</span>
  </form>
  <aside id="panel" aria-label="에이전트 세션">
    <section id="approvals-section" hidden>
      <h2>승인 요청</h2>
      <ul id="approvals"></ul>
    </section>
    <h2>에이전트 세션</h2>
    <p id="sessions-empty">에이전트 세션 없음</p>
    <ul id="sessions"></ul>
  </aside>
  <script src="human.js"></script>
</body>
</html>
