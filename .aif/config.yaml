# .aif/config.yaml — 프로젝트 소유. 프레임워크 기본값을 바꾸는 곳 (Spring의 application.yml 역할)
# 형식: 키: 값, 목록, 한 단계 중첩까지만 쓴다 (aif.mjs가 의존성 없이 읽는다)

framework_version: 0.5.0

# 스타터 선택 (생성할 때 정한다. 바꾸려면 starter.md·variant.md도 다시 복사해야 한다)
purpose: develop          # develop | analyze
variant: app              # develop: web | app | game | api / analyze: research | data

# 주입 (DI)
commands:                 # 확인 명령. 비우면 그 확인은 "확인 수단 없음"으로 보고된다
  test: ""
  lint: ""
  build: ""
paths:                    # 기록·검사가 파일을 분류하는 기준 (glob)
  code: ["src/**"]
  tests: ["**/*.test.*", "**/*.spec.*", "tests/**", "test/**"]
  data_raw: ["data/raw/**"]
roles: [dev]              # develop에서 켤 역할 모듈: planner, dev, frontend, backend, qa
verifier: [code-review, reviewer]   # 표준 경로의 검증자 (여러 개 가능)
                          #   code-review: 내장 /code-review (새 서브에이전트가 diff 검토)
                          #   verify: 내장 /verify (앱을 빌드·실행해 확인)
                          #   reviewer: spec 대조 에이전트 (완료 기준마다 판정)
                          #   session: 새 세션에서 직접 판정
goal_loop: true           # 확인 명령이 있으면 수행 단계에서 /goal <완료 기준>을 쓴다
collector: deep-research  # analyze/research의 수집: deep-research(내장 /deep-research) | manual

# 상한 기본값 (목표 문서·카드에서 작업마다 다시 정할 수 있다)
budgets:                   # 규모별 기대 실작업 시간(분)·토큰(캐시 읽기 제외). 1.5배를 넘으면 멈추고 묻는다. 완료 기준이 아니다
  S: {minutes: 30, tokens: 500000}
  M: {minutes: 120, tokens: 2000000}
  L: {minutes: null, tokens: null}
limits:
  hours_per_task: null
  tokens_per_task: null
  auto_fix_rounds: 2       # 검증 FAIL 때 사람 없이 "고치기 → 새 검증자로 다시 검증"을 반복하는 횟수. 넘으면 멈추고 원인을 보고한다

# 끄기 (고정 항목은 끌 수 없다. 끈 것은 피드백 보고에 "끈 규칙"으로 이유와 함께 나온다)
hooks_off: []             # 예: [check]  이유는 아래 off_reasons에
checks_off: []            # rules.yaml의 id. 예: [D-TEST-FIRST]
off_reasons: {}

# 피드백
exporters: [html, markdown]
promote_threshold: 2      # 같은 원인이 이 수 이상의 프로젝트에서 나오면 공통 반영 후보
