# PR과 main에서 시험을 돌린다(카드 20261122-pr-ci). 릴리스 전에 문제를 잡는다.
#   - Linux: lint → build → E2E(창 표시 모드). E2E는 화면을 그려야 하는 시험이 있어 Xvfb에 창을 띄운다.
#   - macOS: lint → 단위 시험 전체(macOS 전용 시험 포함. Linux에서는 그 시험들이 돌지 않는다).
# 묶은 앱 시험(test:dist)은 dmg를 만들어야 해서 릴리스 워크플로(release.yml)가 돌린다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Electron 샌드박스가 뜨게 한다
        # Ubuntu 24.04는 권한 없는 사용자 네임스페이스를 막아 Electron 샌드박스가 시작하지 못한다
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: E2E (창 표시)
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npx playwright test --reporter=line
        env:
          AB_TEST_SHOW: '1' # 숨긴 창은 Linux에서 그리지 않아 화면이 필요한 시험이 멈춘다
      - name: 실패 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  macos-unit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
