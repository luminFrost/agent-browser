# 임시: C1 끄는 중 다시 열기 원인 가르기(지울 브랜치)
name: bisect-c1
on:
  push:
    branches: ['bisect/**']
jobs:
  c1:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: C1 3번
        run: npx playwright test -c playwright.dist.config.ts -g "C1" --repeat-each=3 --reporter=line
        env: { AB_DIST_SKIP_FRONTMOST: '1' }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: c1-results, path: test-results/, if-no-files-found: ignore }
